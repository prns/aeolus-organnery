name: Linux x86_64 build

on:
  push:
    branches: [windows-port]
    paths:
      - 'source/**'
      - 'debian/**'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Aeolus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkgconf \
            libasound2-dev libclthreads-dev libclxclient-dev \
            libjack-dev libreadline-dev libzita-alsa-pcmi-dev \
            libfreetype-dev libxft-dev libx11-dev

      - name: Build Aeolus and Linux UI modules
        run: |
          make -C source -j"$(nproc)" all

      - name: Smoke-test executable
        run: |
          source/aeolus -h

      - name: Stage build outputs
        run: |
          mkdir -p dist
          install -m 0755 source/aeolus dist/aeolus
          install -m 0755 source/aeolus_x11.so dist/aeolus_x11.so
          install -m 0755 source/aeolus_txt.so dist/aeolus_txt.so
          cp README.md COPYING AUTHORS CHANGELOG dist/

      - name: Upload Linux x86_64 build
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-linux-x86_64
          path: dist/
          if-no-files-found: error
