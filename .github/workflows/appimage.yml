name: Build standalone Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [standalone-appimage]
    paths:
      - "source/**"
      - "packaging/appimage/**"
      - ".github/workflows/appimage.yml"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkgconf python3 curl \
            libasound2-dev libclthreads-dev libclxclient-dev libjack-dev \
            libreadline-dev libzita-alsa-pcmi-dev libfreetype-dev
      - name: Build AppImage
        run: |
          sudo apt-get install -y dpkg-dev
          bash packaging/appimage/build.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Aeolus-Linux-x86_64
          path: "*.AppImage"
          if-no-files-found: error
