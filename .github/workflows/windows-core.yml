name: Windows x64 core compile

on:
  push:
    branches: [windows-port]
    paths:
      - 'source/**'
      - 'windows/**'
      - 'third_party/**'
      - '.github/workflows/windows-core.yml'
  workflow_dispatch:

jobs:
  core-compile:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-readline
      - name: Compile portable synthesis and organ-model units
        run: |
          mkdir -p build/windows-core
          for unit in exp2ap rngen scales asection reverb rankwave addsynth division lfqueue; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -Isource \
              -c "source/$unit.cc" -o "build/windows-core/$unit.o"
          done
          ar rcs build/windows-core/libaeolus-core.a build/windows-core/*.o
      - name: Compile clthreads and the isolated MIDI translation unit
        run: |
          mkdir -p build/windows-clthreads
          for unit in p_thread a_thread itc_mesg itc_ip1q itc_ctrl textmsg; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
              -Ithird_party/clthreads -c "third_party/clthreads/$unit.cc" \
              -o "build/windows-clthreads/$unit.o"
          done
          ar rcs build/windows-clthreads/libclthreads.a build/windows-clthreads/*.o
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
            -Isource -Ithird_party/clthreads -c source/imidi.cc \
            -o build/windows-clthreads/imidi.o
          for unit in model slave audio; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
              -DVERSION='"0.9.10"' \
              -Isource -Ithird_party/clthreads -c "source/$unit.cc" \
              -o "build/windows-clthreads/$unit.o"
          done
      - name: Compile portable text interface
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread -Isource -Ithird_party/clthreads -c source/tiface.cc -o build/windows-clthreads/tiface.o
      - name: Link and run the Windows MIDI lifecycle smoke test
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
            -Isource -Ithird_party/clthreads windows/tests/imidi_link_smoke.cc \
            build/windows-clthreads/imidi.o build/windows-core/lfqueue.o \
            build/windows-clthreads/p_thread.o build/windows-clthreads/a_thread.o \
            build/windows-clthreads/itc_mesg.o build/windows-clthreads/itc_ip1q.o \
            build/windows-clthreads/itc_ctrl.o build/windows-clthreads/textmsg.o \
            -o build/windows-clthreads/imidi-link-smoke.exe
          ./build/windows-clthreads/imidi-link-smoke.exe
      - name: Test variable host packet sizes against 64-frame render quanta
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -Iwindows windows/tests/audio_quantum_fifo_test.cc -o build/windows-clthreads/audio-quantum-fifo-test.exe
          ./build/windows-clthreads/audio-quantum-fifo-test.exe
      - name: Test planar-to-interleaved float conversion
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -Iwindows windows/tests/audio_interleave_test.cc -o build/windows-clthreads/audio-interleave-test.exe
          ./build/windows-clthreads/audio-interleave-test.exe
      - name: Compile the native WASAPI render host
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -DINITGUID -Iwindows -c windows/wasapi_audio.cc -o build/windows-clthreads/wasapi_audio.o
      - name: Compile the Aeolus-to-WASAPI adapter
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_WIN32 -D_REENTRANT -pthread -Isource -Ithird_party/clthreads -Iwindows -c windows/wasapi_audio_output.cc -o build/windows-clthreads/wasapi_audio_output.o
      - name: Build Windows console executable
        run: |
          mkdir -p build/windows-app
          for unit in exp2ap rngen scales asection reverb rankwave addsynth division lfqueue; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -Isource -c "source/$unit.cc" -o "build/windows-app/$unit.o"
          done
          for unit in p_thread a_thread itc_mesg itc_ip1q itc_ctrl textmsg; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread -Ithird_party/clthreads -c "third_party/clthreads/$unit.cc" -o "build/windows-app/$unit.o"
          done
          for unit in imidi model slave audio tiface; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -D_WIN32 -D_REENTRANT -pthread -DVERSION='"0.9.10"' -Isource -Ithird_party/clthreads -c "source/$unit.cc" -o "build/windows-app/$unit.o"
          done
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_WIN32 -D_REENTRANT -pthread -Isource -Ithird_party/clthreads -Iwindows -c windows/main.cc -o build/windows-app/main.o
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_WIN32 -DINITGUID -Iwindows -c windows/wasapi_audio.cc -o build/windows-app/wasapi_audio.o
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_WIN32 -D_REENTRANT -pthread -Isource -Ithird_party/clthreads -Iwindows -c windows/wasapi_audio_output.cc -o build/windows-app/wasapi_audio_output.o
          g++ -static -o build/windows-app/aeolus.exe build/windows-app/*.o -pthread -lole32 -luuid
      - name: Check executable runtime dependencies
        run: |
          objdump -p build/windows-app/aeolus.exe | tee build/windows-app/runtime-dependencies.txt
          ! grep -E 'DLL Name: (msys-2.0|readline|termcap|ncurses)' build/windows-app/runtime-dependencies.txt
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-windows-x64-bootstrap
          path: build/windows-app/aeolus.exe
      - name: Assemble standalone folder with default instrument data
        run: |
          mkdir -p build/windows-package
          cp build/windows-app/aeolus.exe build/windows-package/aeolus.exe
          curl -fL https://deb.debian.org/debian/pool/main/s/stops/stops_0.4.0-1_all.deb -o build/windows-package/stops.deb
          echo "76d6864a09433d22adbcf9f370597c965ad300f788f98e1f148f267e5f6ec03b  build/windows-package/stops.deb" | sha256sum -c -
          mkdir -p build/stops-extract
          cd build/stops-extract
          ar x ../windows-package/stops.deb data.tar.xz
          tar -tf data.tar.xz | grep -E '/definition      - name: Upload Windows standalone folder
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-windows-x64-package
          path: build/windows-package/**
      - name: Upload Windows core archive
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-windows-x64-core
          path: build/windows-core/libaeolus-core.a
 | head -20
          tar -xf data.tar.xz -C .
          tar -xOf data.tar.xz ./usr/share/doc/stops/copyright > ../windows-package/stops-COPYRIGHT
          cd ../..
          definition=$(find build/stops-extract -type f -path '*/stops/Aeolus/definition' -print -quit)
          test -n "$definition"
          stops_root=${definition%/Aeolus/definition}
          mkdir -p build/windows-package/stops
          cp -a "$stops_root/." build/windows-package/stops/
          mkdir -p build/windows-package/stops/waves
          test -f build/windows-package/stops/Aeolus/definition
          rm build/windows-package/stops.deb
      - name: Upload Windows standalone folder
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-windows-x64-package
          path: build/windows-package/**
      - name: Upload Windows core archive
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-windows-x64-core
          path: build/windows-core/libaeolus-core.a
