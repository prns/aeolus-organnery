name: Windows x64 core compile

on:
  push:
    branches: [windows-port]
    paths:
      - 'source/**'
      - 'windows/**'
      - 'third_party/**'
      - '.github/workflows/windows-core.yml'
  workflow_dispatch:

jobs:
  core-compile:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-readline
      - name: Compile portable synthesis and organ-model units
        run: |
          mkdir -p build/windows-core
          for unit in exp2ap rngen scales asection reverb rankwave addsynth division lfqueue; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -Isource \
              -c "source/$unit.cc" -o "build/windows-core/$unit.o"
          done
          ar rcs build/windows-core/libaeolus-core.a build/windows-core/*.o
      - name: Compile clthreads and the isolated MIDI translation unit
        run: |
          mkdir -p build/windows-clthreads
          for unit in p_thread a_thread itc_mesg itc_ip1q itc_ctrl textmsg; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
              -Ithird_party/clthreads -c "third_party/clthreads/$unit.cc" \
              -o "build/windows-clthreads/$unit.o"
          done
          ar rcs build/windows-clthreads/libclthreads.a build/windows-clthreads/*.o
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
            -Isource -Ithird_party/clthreads -c source/imidi.cc \
            -o build/windows-clthreads/imidi.o
          for unit in model slave audio; do
            g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
              -DVERSION='"0.9.10"' \
              -Isource -Ithird_party/clthreads -c "source/$unit.cc" \
              -o "build/windows-clthreads/$unit.o"
          done
      - name: Compile portable text interface
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread -Isource -Ithird_party/clthreads -c source/tiface.cc -o build/windows-clthreads/tiface.o
      - name: Link and run the Windows MIDI lifecycle smoke test
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -D_REENTRANT -pthread \
            -Isource -Ithird_party/clthreads windows/tests/imidi_link_smoke.cc \
            build/windows-clthreads/imidi.o build/windows-core/lfqueue.o \
            build/windows-clthreads/p_thread.o build/windows-clthreads/a_thread.o \
            build/windows-clthreads/itc_mesg.o build/windows-clthreads/itc_ip1q.o \
            build/windows-clthreads/itc_ctrl.o build/windows-clthreads/textmsg.o \
            -o build/windows-clthreads/imidi-link-smoke.exe
          ./build/windows-clthreads/imidi-link-smoke.exe
      - name: Test variable host packet sizes against 64-frame render quanta
        run: |
          g++ -std=gnu++11 -O2 -Wall -Wextra -Iwindows windows/tests/audio_quantum_fifo_test.cc -o build/windows-clthreads/audio-quantum-fifo-test.exe
          ./build/windows-clthreads/audio-quantum-fifo-test.exe
      - name: Test planar-to-interleaved float conversion\n        run: |\n          g++ -std=gnu++11 -O2 -Wall -Wextra -Iwindows windows/tests/audio_interleave_test.cc -o build/windows-clthreads/audio-interleave-test.exe\n          ./build/windows-clthreads/audio-interleave-test.exe\n      - name: Upload Windows core archive
        uses: actions/upload-artifact@v4
        with:
          name: aeolus-windows-x64-core
          path: build/windows-core/libaeolus-core.a
